name: Scrape prezzi

# Flusso: test offline -> scraping -> validazione JSON -> commit dei dati su main -> GitHub Pages.
# Pubblicazione: GitHub Pages "Deploy from a branch" (main, cartella /). Il commit dei dati su
# main fa ripartire automaticamente il deploy "pages build and deployment" di GitHub: questo
# workflow non pubblica da sé, ma fallisce (e non committa) se test o validazione falliscono.
#
# Ogni giorno alle 08:00 Europe/Rome. I cron di GitHub sono in UTC: due slot
# (06:00 UTC = 08:00 ora legale, 07:00 UTC = 08:00 ora solare) e uno step iniziale
# che lascia proseguire solo quello giusto. Nessuna modifica al cambio dell'ora.
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      location:
        description: "Nuova località (solo città, es. Milano). Vuoto = invariata"
        required: false
        default: ""
      postcode:
        description: "Nuovo CAP (5 cifre). Vuoto = invariato"
        required: false
        default: ""
      refresh_candidates:
        description: "Rileggi sitemap/ricerche per gli URL prodotto"
        type: boolean
        default: false
      weekly_tasks:
        description: "Esegui anche scoperta farmacie e verifica spedizioni"
        type: boolean
        default: false
      activate_pharmacies:
        description: "Prova ad attivare queste farmacie (id separati da spazio, es. 'farmafides farmacievigorito'): diventano ACTIVE solo con un'offerta autentica"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape-prezzi
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      TZ: Europe/Rome
    steps:
      - name: Controllo orario (08:00 Europe/Rome)
        id: gate
        shell: bash
        run: |
          NOW_HOUR=$(TZ=Europe/Rome date +%H)
          OFFSET=$(TZ=Europe/Rome date +%z)
          echo "Ora attuale a Roma: $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M %Z') (offset $OFFSET)"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Avvio manuale: si procede."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SLOT="${{ github.event.schedule }}"
          # Lo slot è quello delle 08:00 di Roma per l'offset di oggi? (robusto ai ritardi delle code di GitHub)
          SLOT_OK=false
          if { [ "$OFFSET" = "+0200" ] && [ "$SLOT" = "0 6 * * *" ]; } || { [ "$OFFSET" = "+0100" ] && [ "$SLOT" = "0 7 * * *" ]; }; then SLOT_OK=true; fi
          if [ "$NOW_HOUR" = "08" ] || [ "$SLOT_OK" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non sono le 08 a Roma e lo slot '$SLOT' non è quello delle 08: esco senza errori."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Evita doppia esecuzione pianificata nello stesso giorno
        if: steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        id: once
        shell: bash
        run: |
          TODAY=$(TZ=Europe/Rome date +%F)
          if [ -f .github/last_scheduled_run ] && [ "$(cat .github/last_scheduled_run)" = "$TODAY" ]; then
            echo "Esecuzione pianificata di oggi già fatta: esco senza errori."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TODAY" > .github/last_scheduled_run
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.gate.outputs.run == 'true' && steps.once.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze
        if: steps.gate.outputs.run == 'true' && steps.once.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Serve Playwright?
        if: steps.gate.outputs.run == 'true' && steps.once.outputs.skip != 'true'
        id: js
        run: |
          python -c "from scrapers import REGISTRY; print('needs_js=' + str(any(c.requires_js for c in REGISTRY.values())).lower())" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Playwright (solo se uno scraper richiede JavaScript)
        if: steps.js.outputs.needs_js == 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Test (offline) prima di toccare i dati
        if: steps.gate.outputs.run == 'true' && steps.once.outputs.skip != 'true'
        run: python -m pytest -q

      - name: Cambio località (input manuale)
        if: steps.gate.outputs.run == 'true' && (inputs.location != '' || inputs.postcode != '')
        env:
          LOC: ${{ inputs.location }}
          CAP: ${{ inputs.postcode }}
        run: |
          ARGS=(--force)
          [ -n "$LOC" ] && ARGS+=(--city "$LOC")
          [ -n "$CAP" ] && ARGS+=(--postcode "$CAP")
          python physical_pharmacies.py "${ARGS[@]}"

      - name: Attività settimanali (lunedì o su richiesta)
        if: steps.gate.outputs.run == 'true' && steps.once.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$(TZ=Europe/Rome date +%u)" = "1" ] || [ "${{ inputs.weekly_tasks }}" = "true" ]; then
            python pharmacy_discovery.py || echo "::warning::scoperta farmacie non riuscita"
            python shipping.py --check || echo "::warning::verifica spedizioni non riuscita"
          fi
          # Farmacie fisiche: usa una cache settimanale, quindi di solito non fa richieste.
          python physical_pharmacies.py || echo "::warning::aggiornamento farmacie fisiche non riuscito"

      - name: Tentativo di attivazione (input manuale)
        if: steps.gate.outputs.run == 'true' && inputs.activate_pharmacies != ''
        continue-on-error: true
        env:
          IDS: ${{ inputs.activate_pharmacies }}
        shell: bash
        run: |
          ARGS=(--dry-run --activate)
          for id in $IDS; do
            [[ "$id" =~ ^[a-z0-9_]+$ ]] || { echo "::error::id non valido: $id"; exit 1; }
            ARGS+=(--pharmacy "$id")
          done
          python scraper.py "${ARGS[@]}" || true

      - name: Scraping
        if: steps.gate.outputs.run == 'true' && steps.once.outputs.skip != 'true'
        id: scrape
        shell: bash
        run: |
          set +e
          ARGS=()
          [ "${{ inputs.refresh_candidates }}" = "true" ] && ARGS+=(--refresh-candidates)
          python scraper.py "${ARGS[@]}"
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Codice di uscita scraper: $CODE"

      - name: Validazione JSON (contratto dati e storico mai accorciato)
        if: steps.gate.outputs.run == 'true' && steps.once.outputs.skip != 'true'
        id: validate
        run: python validation.py --against-git

      - name: Segnala snapshot parziale
        if: steps.gate.outputs.run == 'true' && steps.once.outputs.skip != 'true'
        shell: bash
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("data.json", encoding="utf-8"))
          scope = (d.get("scope") or {}).get("type")
          carts = d.get("carts") or {}
          if d.get("status") != "OK":
              print(f"::warning::Snapshot {d.get('status')}: non tutte le farmacie attive hanno prodotto offerte valide.")
          if scope == "parziale":
              print("::warning::Scansione parziale: alcune offerte provengono dalla scansione precedente.")
          if carts.get("complete_possible") is False:
              print("::warning::Carrello parziale: senza offerta verificata " + ", ".join(carts.get("products_without_offers") or []))
          la = d.get("last_attempt") or {}
          if la.get("at") and la.get("at") != d.get("generated_at"):
              print(f"::warning::Ultimo tentativo non pubblicato ({la.get('status')}): {la.get('message')}")
          EOF

      - name: Commit e push (solo se ci sono modifiche)
        if: steps.gate.outputs.run == 'true' && steps.once.outputs.skip != 'true'
        shell: bash
        env:
          LOCATION_CHANGED: ${{ inputs.location != '' || inputs.postcode != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES=(data.json price_history.json pharmacies.json product_urls.json shipping_config.json physical_pharmacies.json .github/last_scheduled_run)
          # config.json si committa SOLO se l'utente ha chiesto un cambio di località da questo workflow:
          # così una modifica manuale fatta nel frattempo su GitHub non viene mai sovrascritta.
          if [ "$LOCATION_CHANGED" = "true" ]; then FILES+=(config.json); fi
          git add "${FILES[@]}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git commit -m "Aggiornamento prezzi $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git push && exit 0
            echo "Push rifiutato: riallineo con un rebase SENZA risoluzione automatica dei conflitti ($i/3)"
            if ! git pull --rebase --autostash; then
              git rebase --abort || true
              echo "::error::Conflitto con modifiche arrivate su main durante l'esecuzione: nessun dato pubblicato. I file generati sono nell'artifact 'dati-${{ github.run_id }}'."
              exit 1
            fi
            python validation.py || { echo "::error::Dati non validi dopo il riallineamento: push annullato."; exit 1; }
            sleep 5
          done
          echo "::error::push non riuscito"; exit 1

      - name: Log come artifact
        if: always() && steps.gate.outputs.run == 'true' && steps.once.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/*.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Dati generati come artifact (solo in caso di errore)
        if: failure() && steps.gate.outputs.run == 'true' && steps.once.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dati-${{ github.run_id }}
          path: |
            data.json
            price_history.json
            pharmacies.json
            product_urls.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Esito
        if: steps.gate.outputs.run == 'true' && steps.once.outputs.skip != 'true'
        shell: bash
        run: |
          CODE="${{ steps.scrape.outputs.code }}"
          if [ "$CODE" = "0" ]; then echo "Scraping completato. GitHub Pages si aggiorna dal commit su main."; exit 0; fi
          if [ "$CODE" = "2" ]; then echo "::error::Nessuna offerta valida: dati precedenti conservati (vedi log)."; exit 1; fi
          if [ "$CODE" = "3" ]; then echo "::error::Validazione o scrittura fallita: dati precedenti conservati (vedi log)."; exit 1; fi
          echo "::error::Scraper terminato con codice $CODE"; exit 1
